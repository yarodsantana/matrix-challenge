<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Challenge</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/jquery.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 mb-4">Matrix Challenge</h1>
    <div class="row g-4">
      <section class="col-lg-5" aria-label="Entrada">
        <form id="matrix-form">
          <div class="mb-3">
            <label for="operation" class="form-label">Operación</label>
            <select id="operation" class="form-select">
              <option value="rotate">Rotación</option>
              <option value="qr">Rotación + factorización QR</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="matrix-input" class="form-label">Matriz</label>
            <textarea id="matrix-input" class="form-control font-monospace" rows="7" spellcheck="false" required aria-describedby="matrix-help">[
  [1, 2, 3],
  [4, 5, 6]
]</textarea>
            <div id="matrix-help" class="form-text">Ingresa un array de arrays de números.</div>
          </div>
          <div class="mb-3">
            <label for="token" class="form-label">Token</label>
            <input id="token" class="form-control" type="password" autocomplete="off" spellcheck="false" required>
          </div>
          <button id="submit" class="btn btn-primary" type="submit">Calcular</button>
        </form>
        <div id="message" class="alert mt-3 d-none" role="status" aria-live="polite"></div>
      </section>
      <section class="col-lg-7" aria-labelledby="result-title">
        <h2 id="result-title" class="h5">Resultado</h2>
        <p id="empty-result" class="text-secondary">Completa los campos y presiona Calcular.</p>
        <div id="result" class="d-none">
          <div id="statistics" class="table-responsive"></div>
          <p id="diagonal-result" class="small"></p>
          <div id="matrices"></div>
          <details class="mt-3">
            <summary>Ver JSON</summary>
            <pre id="raw-result" class="border rounded p-3 mt-2 bg-light"></pre>
          </details>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
